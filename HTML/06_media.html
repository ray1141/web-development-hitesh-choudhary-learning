<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Media</title>
  </head>
  <body>
    <h1>Learning Media Tags</h1>
    <h4>Adding Images with Img tag in a generic manner--</h4>
    <img src="./image.jpg" width="200px" alt="A cat working on a laptop" />
    <p>Cat working on a laptop</p>
    <h4>Adding Images with Heading in Modern way using Figure tag--</h4>
    <figure>
      <img src="./image.jpg" width="200px" alt="A cat working on a laptop" />
      <figcaption>A Cat Working on a Laptop</figcaption>
    </figure>
  </body>
</html>
