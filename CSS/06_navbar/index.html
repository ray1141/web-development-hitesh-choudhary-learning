<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Navbar Variations</title>
    <style>
      body {
        margin: 0;
        background-color: #1a1a1a;
        color: #fff;
        padding: 20px;
        font-family: Arial, Helvetica, sans-serif;
      }
      .nav-container {
        margin-bottom: 20px;
      }
      h2 {
        margin-bottom: 10px;
      }
      .nav1 {
        background-color: #e8dcdc;
        padding: 5px;
      }
      .nav1 ul {
        display: flex;
        list-style-type: none;
        justify-content: space-around;
        margin: 0;
        padding: 10px;
      }
      .nav1 li {
        display: inline;
      }
      .nav1 a {
        text-decoration: none;
        color: #000;
        padding: 5px 15px;
        position: relative;
      }
      .nav1 a::after {
        content: "";
        position: absolute;
        bottom: 0;
        left: 0;
        width: 100%;
        height: 2px;
        transform: scaleX(0);
        transition: transform 0.3s ease-in-out;
        background-color: #1d10d3;
      }
      .nav1 a:hover::after {
        transform: scaleX(1);
      }
      .nav1 .login-btn {
        background-color: #168df5;
        border-radius: 5px;
        padding: 5px 15px;
        color: #fff; /* background-color: #fff; */
        cursor: pointer;
      }
      .nav2 {
        background-color: #6e2a5c;
        width: 300px;
        padding: 25px;
      }
      .nav2 ul {
        list-style-type: none;
        padding: 0;
        margin: 0;
      }
      .nav2 li {
        margin-bottom: 20px;
      }
      .nav2 a {
        text-decoration: none;
        color: #fff;
        display: block;
        padding: 10px;
        width: 100%;
      }
      .nav2 a:hover {
        background-color: #a64d8e;
        width: 100%;
      }
      .nav2 .login-btn {
        background-color: #925e84;
        color: #fff;
        width: 100%;
        cursor: pointer;
        padding: 20px;
        margin-left: 1px;
        border: none;
      }
      .nav2 .login-btn:hover {
        border: 1px white solid;
        font-size: large;
      }
      .nav3 {
        background-color: #b5b266;
        padding: 10px;
        margin-bottom: 190px;
      }
      .nav3 ul {
        list-style-type: none;
        margin: 0;
        padding: 0;
        display: flex;
        justify-content: space-around;
        align-items: center;
      }
      .nav3 li {
        padding: 5px;
      }
      .nav3 a {
        text-decoration: none;
        color: #000;
        display: block;
      }
      .nav3 a:hover {
        color: #f27b04;
      }
      .nav3 .dropdown-content {
        display: none;
      }
      .nav3 .dropdown:hover .dropdown-content {
        display: block;
        position: absolute;
        background-color: #b5b266;
        padding: 10px;
        border: 1px solid black;
      }
      .nav3 .login-btn {
        background-color: #f27b04;
        border: none;
        color: #fff;
        padding: 10px;
        width: 80px;
        cursor: pointer;
      }
      .nav3 .login-btn:hover {
        border: 1px solid white;
      }
    </style>
  </head>
  <body>
    <div class="nav-container">
      <h2>Variation 1: Horizontal with underline effect</h2>
      <nav class="nav1">
        <ul>
          <li><a href="#">Home</a></li>
          <li><a href="#">About</a></li>
          <li><a href="#">Products</a></li>
          <li><button class="login-btn">Login</button></li>
        </ul>
      </nav>
    </div>
    <div class="nav-container">
      <h2>Variation 2: Vertical with hover effect</h2>
      <nav class="nav2">
        <ul>
          <li><a href="#">Home</a></li>
          <li><a href="#">About</a></li>
          <li><a href="#">Products</a></li>
        </ul>
        <button class="login-btn">Login</button>
      </nav>
    </div>
    <div class="nav-container">
      <h2>Variation 3: Horizontal with dropdown</h2>
      <nav class="nav3">
        <ul>
          <li><a href="#">Home</a></li>
          <li class="dropdown">
            <a href="#">About</a>
            <div class="dropdown-content">
              <a href="#">Our Story</a>
              <a href="#">Team</a>
              <a href="#">Contact</a>
            </div>
          </li>
          <li><a href="#">Products</a></li>
          <li><button class="login-btn">Login</button></li>
        </ul>
      </nav>
    </div>
  </body>
</html>
