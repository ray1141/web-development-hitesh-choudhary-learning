<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flexbox Masterclass</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <h1>Flexbox Masterclass</h1>
    <div class="container">
      <h2>1. Flex (row)</h2>
      <div class="flex-container">
        <div class="box">1</div>
        <div class="box">2</div>
        <div class="box">3</div>
        <div class="box">4</div>
        <div class="box">5</div>
      </div>
    </div>
    <div class="container">
      <h2>2. Flex direction (column)</h2>
      <div class="flex-container" style="flex-direction: column">
        <div class="box">1</div>
        <div class="box">2</div>
        <div class="box">3</div>
        <div class="box">4</div>
        <div class="box">5</div>
      </div>
    </div>
    <div class="container">
      <h2>3. Justify Content</h2>
      <div class="flex-container" style="justify-content: space-between">
        <div class="box">1</div>
        <div class="box">2</div>
        <div class="box">3</div>
        <div class="box">4</div>
        <div class="box">5</div>
      </div>
    </div>
    <div class="container">
      <h2>4. Align Items</h2>
      <div class="flex-container" style="align-items: center">
        <div class="box">1</div>
        <div class="box">2</div>
        <div class="box">3</div>
        <div class="box">4</div>
        <div class="box">5</div>
      </div>
    </div>
    <div class="container">
      <h2>5. Flex Wrap</h2>
      <div class="flex-container" style="flex-wrap: wrap">
        <div class="box">1</div>
        <div class="box">2</div>
        <div class="box">3</div>
        <div class="box">4</div>
        <div class="box">5</div>
        <div class="box">6</div>
        <div class="box">7</div>
        <div class="box">8</div>
        <div class="box">9</div>
        <div class="box">10</div>
        <div class="box">11</div>
        <div class="box">12</div>
      </div>
    </div>
    <div class="container">
      <h2>6. Align Content</h2>
      <div class="flex-container" style="align-content: space-between">
        <div class="box">1</div>
        <div class="box">2</div>
        <div class="box">3</div>
        <div class="box">4</div>
        <div class="box">5</div>
      </div>
    </div>
    <div class="container">
      <h2>7. Order Property</h2>
      <div class="flex-container">
        <div class="box" style="order: 5">1</div>
        <div class="box" style="order: 1">2</div>
        <div class="box" style="order: 3">3</div>
        <div class="box" style="order: 2">4</div>
        <div class="box" style="order: 4">5</div>
      </div>
    </div>
    <div class="container">
      <h2>8. Flex grow</h2>
      <div class="flex-container">
        <div class="box" style="flex-grow: 1">1</div>
        <div class="box" style="flex-grow: 2">2</div>
        <div class="box" style="flex-grow: 3">3</div>
        <div class="box" style="flex-grow: 4">4</div>
        <div class="box" style="flex-grow: 5">5</div>
      </div>
    </div>
    <div class="container">
      <h2>9. Align Self</h2>
      <div class="flex-container">
        <div class="box" style="align-self: flex-start">1</div>
        <div class="box" style="align-self: center">2</div>
        <div class="box" style="align-self: flex-end">3</div>
        <div class="box" style="align-self: stretch; height: auto">4</div>
        <div class="box" style="align-self: baseline">5</div>
      </div>
    </div>
  </body>
</html>
