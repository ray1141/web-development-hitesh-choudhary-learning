<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login Page</title>
    <style>
      body {
        font-family: Arial, Helvetica, sans-serif;
        background-color: #1f1f1f;
        margin: 0;
        padding: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
      }
      .login-card {
        background-color: rgb(90, 90, 197);
        border-radius: 10px;
        width: 400px;
        padding: 30px;
      }
      h1 {
        color: bisque;
        text-align: center;
        margin-bottom: 25px;
      }
      form {
        display: flex;
        flex-direction: column;
      }
      input {
        padding: 10px;
        margin-bottom: 15px;
        border-radius: 5px;
        border: 1px solid black;
      }
      button {
        background-color: rgb(206, 218, 137);
        border-radius: 5px;
        border: 1px solid black;
        color: #2c2c2c;
        padding: 8px;
        margin-bottom: 25px;
      }
      button:hover {
        background-color: greenyellow;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="login-card">
      <h1>Login</h1>
      <form>
        <input type="email" name="" id="" placeholder="Email" />
        <input type="password" name="" id="" placeholder="Password" />
        <button type="submit">Login</button>
      </form>
    </div>
  </body>
</html>
